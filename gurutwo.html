<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Connect Game</title>
  <style>
    body { font-family: Comic Sans MS; text-align:center; background:#fff8dc; }
    h1 { color:#ff4500; }
    #letters { display:flex; justify-content:center; margin:20px; }
    .letter {
      width:50px; height:50px; margin:5px; background:#ffcc00;
      border-radius:5px; display:flex; align-items:center; justify-content:center;
      font-size:24px; cursor:grab;
    }
    #target { margin-top:20px; font-size:28px; min-height:40px; border:2px dashed #333; padding:10px; }
    #message { margin-top:20px; font-size:22px; color:green; }
    .nav { margin:20px; }
  </style>
</head>
<body>
  <h1>🔤 Word Connect</h1>
  <p>Drag letters to form the word shown!</p>
  <div class="nav"><a href="guruzero.html">🏠 Back to Home</a></div>
  <h2 id="wordHint">Word: CAT</h2>
  <div id="letters"></div>
  <div id="target" ondragover="allowDrop(event)" ondrop="dropLetter(event)"></div>
  <div id="message"></div>

  <script>
    let words=["CAT","DOG","SUN"];
    let current=0;

    function loadWord(){
      document.getElementById("wordHint").textContent="Word: "+words[current];
      document.getElementById("target").textContent="";
      let lettersArea=document.getElementById("letters");
      lettersArea.innerHTML="";
      let letters=words[current].split("");
      // add some extra random letters
      let extras=["X","Y","Z","O","A"];
      letters=letters.concat(extras).sort(()=>Math.random()-0.5);
      letters.forEach(l=>{
        let div=document.createElement("div");
        div.className="letter"; div.textContent=l; div.draggable=true;
        div.addEventListener("dragstart",ev=>{
          ev.dataTransfer.setData("text",ev.target.textContent);
        });
        lettersArea.appendChild(div);
      });
      document.getElementById("message").textContent="";
    }

    function allowDrop(ev){ ev.preventDefault(); }
    function dropLetter(ev){
      ev.preventDefault();
      let data=ev.dataTransfer.getData("text");
      ev.target.textContent += data;
      if(ev.target.textContent===words[current]){
        document.getElementById("message").textContent="🎉 Correct!";
        setTimeout(()=>{
          current=(current+1)%words.length;
          loadWord();
        },1500);
      }
    }

    loadWord();
  </script>
</body>
</html>
